version: '3.8'
services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    ports: ['27017:27017']
    volumes: ['mongo_data:/data/db']

  ollama:
    image: ollama/ollama:latest
    ports: ['11434:11434']
    volumes: ['ollama_data:/root/.ollama']
    command: serve

volumes:
  mongo_data:
  ollama_data:
