name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra sentence-transformers --index https://pypi.org/simple
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: git ls-files -z '*.md' | xargs -0 -r uv run mdformat --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra sentence-transformers --index https://pypi.org/simple
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra sentence-transformers --index https://pypi.org/simple
      - name: Cache Hugging Face model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      # Coverage gate runs here (not locally) because the live-Mongo tests
      # only execute against the atlas-local service container, so this job
      # is the one place coverage is deterministic.
      - run: uv run pytest --cov=src --cov-report=term --cov-fail-under=80
        env:
          LIBRARIAN_DATABASE_URI: mongodb://localhost:27017
