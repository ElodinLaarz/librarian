[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librarian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "motor",
    "pydantic",
    "pydantic-settings",
    "langchain-text-splitters",
    "trafilatura",
    "instructor",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
# Heavy ML deps (pulls torch ~870MB) — install separately when needed
sentence-transformers = ["sentence-transformers"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["librarian"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs
module = [
    "fastmcp.*",
    "motor.*",
    "langchain_text_splitters.*",
    "trafilatura.*",
    "instructor.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
