[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librarian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.26.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pyyaml==6.0.3",
    "langchain-text-splitters==1.1.1",
    "instructor==1.14.5",
    "trafilatura==2.0.0",
    "httpx==0.28.1",
    "numpy==2.4.3",
    "numpydantic==1.8.0",
    "motor==3.7.0",
    "pymongo==4.11.1"
]

[project.optional-dependencies]
# Heavy ML deps (pulls torch ~870MB) — install separately when needed
sentence-transformers = ["sentence-transformers"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "mdformat",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# tool_schemas.py mixes third-party (pydantic) and first-party (src.models)
# imports; ruff's isort misclassifies the section boundary in this layout.
"src/models/tool_schemas.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs
module = [
    "mcp.*",
    "motor.*",
    "langchain_text_splitters.*",
    "trafilatura.*",
    "instructor.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
